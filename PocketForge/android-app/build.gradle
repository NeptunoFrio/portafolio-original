plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pocketforge.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.pocketforge.launcher"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0-Alpha"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Configura los procesadores de celular compatibles (ARM 64 bits)
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // NUEVA SECCIÓN: Le dice a Gradle dónde está nuestro compilador de C++
    externalNativeBuild {
        cmake {
            path "../native-core/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
